appId: com.iker.jarvis
productName: JARVIS
directories:
  output: release
  buildResources: build

files:
  - out/**/*
  - package.json

asar: true

win:
  target:
    - target: nsis
      arch: [x64]
  # Sin firma de codigo: Windows SmartScreen avisara la primera vez.
  # Es normal en apps personales; se acepta con "Mas informacion > Ejecutar de todas formas".

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true

mac:
  target:
    - target: dmg
      arch: [universal]
  category: public.app-category.productivity
  # macOS necesita declarar por que pide acceso a carpetas del usuario.
  extendInfo:
    NSDesktopFolderUsageDescription: JARVIS necesita acceso para organizar tus archivos del escritorio.
    NSDocumentsFolderUsageDescription: JARVIS necesita acceso para organizar tus documentos del colegio.
    NSDownloadsFolderUsageDescription: JARVIS necesita acceso para clasificar los archivos que descargas.

dmg:
  artifactName: ${productName}-${version}-${arch}.${ext}
