appId: com.iker.jarvis
productName: JARVIS
copyright: Copyright (c) 2026 Iker
directories:
  output: release
  buildResources: build

files:
  - out/**/*
  - package.json

asar: true

# --- Actualizaciones -------------------------------------------------------
#
# Los releases van a un repositorio APARTE y publico. El codigo sigue privado:
# electron-updater no puede leer releases privados sin un token dentro del
# binario, y ese token seria extraible por cualquiera que abriera el .exe.
#
# Aqui solo se publican el instalador y las notas del parche, que es lo que la
# app necesita descargar de todas formas.
publish:
  - provider: github
    owner: AvatarGamer10
    repo: jarvis-releases
    # Borrador a proposito: compilar y que eso llegue solo a todos los equipos
    # en el mismo gesto no deja margen para revisar nada. Se publica a mano
    # desde GitHub, y hasta entonces nadie recibe la actualizacion.
    releaseType: draft

# --- Windows ---------------------------------------------------------------

win:
  target:
    - target: nsis
      arch: [x64]
  icon: build/icon.ico
  publisherName: Iker
  # La app no necesita permisos de administrador para nada. Declararlo evita
  # que Windows y los antivirus la traten como algo que quiere tocar el sistema.
  requestedExecutionLevel: asInvoker
  # Sin firma de codigo: SmartScreen avisara la primera vez, y algunos
  # antivirus daran un falso positivo. Ver la seccion sobre esto en el README:
  # la unica solucion completa es un certificado de firma.

nsis:
  oneClick: false
  perMachine: false
  # Sin esto, electron-builder empaqueta elevate.exe, un binario auxiliar para
  # pedir permisos de administrador. Es un disparador conocido de heuristicos
  # antivirus y aqui no se usa: la instalacion es por usuario.
  allowElevation: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: JARVIS
  # 1034 es el identificador de espanol en NSIS.
  language: '1034'
  # Al desinstalar no se borran los ajustes ni las tareas apuntadas: si alguien
  # reinstala, se encuentra sus cosas donde las dejo.
  deleteAppDataOnUninstall: false
  artifactName: ${productName}-${version}-instalador.${ext}

  installerIcon: build/icon.ico
  uninstallerIcon: build/icon.ico
  installerHeaderIcon: build/icon.ico
  installerHeader: build/installerHeader.bmp
  installerSidebar: build/installerSidebar.bmp
  uninstallerSidebar: build/uninstallerSidebar.bmp
  include: build/installer.nsh

# --- macOS -----------------------------------------------------------------

mac:
  target:
    - target: dmg
      arch: [universal]
  icon: build/icon.png
  category: public.app-category.productivity
  # macOS necesita declarar por que se pide acceso a carpetas del usuario.
  extendInfo:
    NSDesktopFolderUsageDescription: JARVIS necesita acceso para organizar tus archivos del escritorio.
    NSDocumentsFolderUsageDescription: JARVIS necesita acceso para organizar tus documentos del colegio.
    NSDownloadsFolderUsageDescription: JARVIS necesita acceso para clasificar los archivos que descargas.

dmg:
  artifactName: ${productName}-${version}-${arch}.${ext}
  title: JARVIS
  background: build/dmg-background.png
  window:
    width: 540
    height: 380
  iconSize: 96
  # El icono a la izquierda y la carpeta Aplicaciones a la derecha: el gesto de
  # arrastrar de una a otra se entiende sin escribir instrucciones.
  contents:
    - x: 150
      y: 250
      type: file
    - x: 390
      y: 250
      type: link
      path: /Applications
